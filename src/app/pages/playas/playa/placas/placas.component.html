<div class="container-fluid">
  <div class="row">
    <!-- Columna de la tabla (izquierda) -->
    <div class="col-md-9">
      <input type="text" class="form-control mb-3" placeholder="Buscar registros" [(ngModel)]="filtro" />
      <table class="table table-striped">
        <thead>
          <tr>
            <th class="col-id">ID</th>
            <th class="col-ingreso">Ingreso</th>
            <th class="col-placa">Placa</th>
            <th class="col-imagen">Imagen Placa</th>
            <th class="col-monto">Monto</th>
            <th class="col-estado">Estado</th>
            <th class="col-opc">Opc.</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of datosFiltrados()">
            <td class="col-id">{{ item.id_auto || item.id_moto }}</td>
            <td class="col-ingreso">
              {{ this.pdfClient.formatHora(item.hora_entrada) }}
            </td>
            <td class="col-placa">{{ item.placa }}</td>
            <td class="col-imagen">
              <img *ngIf="item.image" [src]="item.image" alt="No cargo"
                style="max-width: 200px; max-height: 200px" />
            </td>
            <td class="col-monto">
              <p *ngIf="item.state == 3">S/.{{ item.total_pagar}}</p>
              <p *ngIf="item.state == 1 || item.state == 2">S/. 0.00</p>
            </td>
            <td class="col-estado" [ngStyle]="{
                'background-color':
                  item.state === 2
                    ? '#FF5353'
                    : item.state === 3
                    ? '#53FF7A'
                    : 'transparent',
                color: item.state === 1 || item.state === 1 ? 'white' : 'black',
                'text-align': 'center'
              }">
              <div *ngIf="item.state === 1" class="estado-default">
                <p class="text-dark">NO TICKET</p>
              </div>
              <div *ngIf="item.state === 2" class="estado-rojo">
                <p class="text-dark">PENDIENTE</p>
              </div>

              <!-- Estado 3 -->
              <div *ngIf="item.state === 3" class="estado-verde">
                <p class="text-dark">CANCELADO</p>
              </div>
            </td>

            <td class="col-opc">
              <div *ngIf="item.state === 2" class="estado-rojo">
                <div class="btn-group" role="group" aria-label="Basic example">
                  <button type="button" (click)="printTicket(item, 2)" class="btn0 btn btn-primary">
                    <i class="fa-solid fa-car"></i>
                  </button>

                  <!-- Botón de pago simple (siempre disponible) -->
                  <button type="button" (click)="printPago(item, 3)" class="btn0 btn btn-success">
                    <i class="fa-solid fa-money-bill-1-wave"></i>
                  </button>

                  <!-- Botones adicionales solo si la playa requiere facturación -->
                  <ng-container *ngIf="playa.facturacion">
                    <button type="button" class="btn1 btn btn-warning" title="Boleta/Factura Directa">
                      <i class="fa-solid fa-receipt"></i>BV Directa
                    </button>
                    <button type="button" class="btn1 btn btn-info" title="Boleta/Factura con Cliente">
                      <i class="fa-solid fa-user-plus"></i>BV/FV Cliente
                    </button>
                  </ng-container>
                </div>
              </div>

              <!-- Estado 3 - Vehículo pagado -->
              <div *ngIf="item.state === 3" class="estado-verde">
                <ng-container *ngIf="playa.facturacion">
                  <button type="button" class="btn1 btn btn-secondary" title="Generar Boleta/Factura Directa">
                    <i class="fa-solid fa-receipt"></i>BV Directa
                  </button>
                  <button type="button" class="btn1 btn btn-secondary" title="Generar Boleta/Factura con Cliente">
                    <i class="fa-solid fa-user-plus"></i>BV/FV Cliente
                  </button>
                </ng-container>
                <span *ngIf="!playa.facturacion" class="text-success">
                  <i class="fa-solid fa-check-circle"></i> Pagado
                </span>
              </div>



              <!-- Otros estados -->
              <div *ngIf="item.state == 1 " class="estado-default">
                <div class="btn-group" role="group" aria-label="Basic example">
                  <button type="button" (click)="printTicket(item, 2)" class="btn0 btn btn-primary">
                    <i class="fa-solid fa-car"></i>
                  </button>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Columna del formulario (derecha) -->
    <div class="col-md-2 align-self-start">
      <p class="h1">Placa Manual</p>
      <form #Formulario="ngForm">
        <div class="m-1">
          <input type="text" class="form-control" placeholder="Placa" name="placa" [(ngModel)]="placaManual" />
        </div>
        <div>
          <button type="button" (click)="createManualCar()" class="px-5 btn btn-primary me-2">
            <i class="fa-solid fa-car"></i>
          </button>
          <button type="button" (click)="createManualMotorcycle()" class="px-5 btn btn-primary">
            <i class="fa-solid fa-motorcycle"></i>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="alert alert-danger alert-dismissible fade show" role="alert"
  *ngIf="this.pdfClient.showAlert || this.pdfClient.fadingOut" [ngClass]="{ 'fade-out': this.pdfClient.fadingOut }">
  {{ this.pdfClient.errorMessage }}
  <button type="button" class="btn-close" aria-label="Close" (click)="this.pdfClient.showAlert = false"></button>
</div>
